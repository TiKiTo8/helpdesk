http:
  routers:
    site:
      rule: "Host(`helpdesk.localhost`)"
      service: web
    api:
      rule: "Host(`helpdesk.localhost`) && PathPrefix(`/api`)"
      service: api
    dashboard:
      rule: "Host(`traefik.localhost`)"
      service: api@internal
    grafana:
      rule: "Host(`grafana.localhost`)"
      service: grafana
    prometheus:
      rule: "Host(`prometheus.localhost`)"
      service: prometheus
    mail:
      rule: "Host(`mail.localhost`)"
      service: mail

    alertmanager:
      rule: "Host(`alertmanager.localhost`)"
      service: alertmanager

    grafana:
      rule: "Host(`grafana.localhost`)"
      service: grafana

    prometheus:
      rule: "Host(`prometheus.localhost`)"
      service: prometheus

    mail:
      rule: "Host(`mail.localhost`)"
      service: mail

  services:
    web:
      loadBalancer:
        servers:
          - url: "http://web:80"
    api:
      loadBalancer:
        servers:
          - url: "http://api:8000"
    grafana:
      loadBalancer:
        servers:
          - url: "http://grafana:3000"
    prometheus:
      loadBalancer:
        servers:
          - url: "http://prometheus:9090"
    mail:
      loadBalancer:
        servers:
          - url: "http://mail:8025"
    alertmanager:
      loadBalancer:
        servers:
          - url: "http://alertmanager:9093"
