name: helpdesk

x-postgres-image: &postgres-image postgres:18.6-alpine@sha256:123b17998ccaf47e53b502e8c6a1e79afd8f579c6f3eec83c563da026f957395

x-logging: &logging
  driver: json-file
  options:
    max-size: 10m
    max-file: "3"

x-postgres-limits: &postgres-limits
  resources:
    limits:
      memory: 512m
      cpus: "1"
      pids: 256

services:
  # Reverse proxy et front (Maxime)

  traefik:
    image: traefik:v3.6@sha256:31267173a15b4944e797a76ffd9c419707c8d8b32fe5b610f80cd0cfa05f372d
    restart: unless-stopped
    user: "65534:65534"
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    pids_limit: 100
    ports:
      - "127.0.0.1:80:80"   # accessible depuis ce PC seulement, pas depuis le reste du réseau
    volumes:
      - ./traefik/traefik.yml:/etc/traefik/traefik.yml:ro,z
      - ./traefik/dynamic.yml:/etc/traefik/dynamic.yml:ro,z
    networks: [proxy]
    logging: *logging
    healthcheck:
      test: ["CMD", "traefik", "healthcheck", "--ping"]
      interval: 10s
      timeout: 3s
      retries: 3

  web:
    build: ./web
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    mem_limit: 64m
    pids_limit: 50
    volumes:
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro,z
      - ./web/index.html:/usr/share/nginx/html/index.html:ro,z
    networks: [proxy]
    logging: *logging
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3

  # Base de données, réplication et sauvegardes (Luka)

  db:
    image: *postgres-image
    user: postgres
    restart: unless-stopped
    command: ["postgres", "-c", "wal_keep_size=256MB"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-helpdesk}
      POSTGRES_DB: ${POSTGRES_DB:-helpdesk}
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
      REPLICATION_PASSWORD_FILE: /run/secrets/replication_password
      APP_PASSWORD_FILE: /run/secrets/app_password
      POSTGRES_INITDB_ARGS: --locale-provider=icu --icu-locale=fr-FR
    secrets: [db_password, replication_password, app_password]
    volumes:
      # Depuis la v18, les données sont dans /var/lib/postgresql/18/docker
      - db-data:/var/lib/postgresql
      - ./db/init:/docker-entrypoint-initdb.d:ro
    networks: [backend]
    shm_size: 128mb
    stop_grace_period: 30s
    logging: *logging
    deploy: *postgres-limits
    healthcheck:
      # En TCP : pendant l'initialisation, Postgres n'écoute que sur son socket local
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      start_period: 30s
      start_interval: 2s
      interval: 10s
      timeout: 3s
      retries: 3

  db-replica:
    image: *postgres-image
    user: postgres
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/scripts/replica-entrypoint.sh"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-helpdesk}
      POSTGRES_DB: ${POSTGRES_DB:-helpdesk}
    secrets: [replication_password]
    volumes:
      - db-replica-data:/var/lib/postgresql
      - ./db/replica:/scripts:ro
    depends_on:
      db:
        condition: service_healthy
    networks: [backend]
    shm_size: 128mb
    stop_grace_period: 30s
    logging: *logging
    deploy: *postgres-limits
    healthcheck:
      test: ["CMD-SHELL", "[ \"$$(psql -U $${POSTGRES_USER} -d $${POSTGRES_DB} -tAc 'SELECT status FROM pg_stat_wal_receiver')\" = streaming ]"]
      start_period: 30s
      start_interval: 2s
      interval: 10s
      timeout: 3s
      retries: 3

  backup:
    image: *postgres-image
    user: postgres
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/scripts/backup.sh"]
    environment:
      PGHOST: db-replica
      PGUSER: ${POSTGRES_USER:-helpdesk}
      PGDATABASE: ${POSTGRES_DB:-helpdesk}
      BACKUP_INTERVAL: ${BACKUP_INTERVAL:-3600}
      BACKUP_KEEP: ${BACKUP_KEEP:-7}
    secrets: [db_password]
    volumes:
      # Dossier qui appartient à postgres dans l'image : le volume hérite de ce propriétaire
      - backups:/var/lib/postgresql
      - ./backup:/scripts:ro
    depends_on:
      db:
        condition: service_healthy
    networks: [backend]
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "0.5"
          pids: 32
    healthcheck:
      # Dernière sauvegarde de moins de deux intervalles
      test: ["CMD-SHELL", "find /var/lib/postgresql/backups -name '*.dump' -mmin -$$((BACKUP_INTERVAL / 30 + 1)) | grep -q ."]
      start_period: 30s
      interval: 30s
      timeout: 5s
      retries: 3

  # Application

  api:
    build: ./app
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_REPLICA_HOST: db-replica
      DB_NAME: ${POSTGRES_DB:-helpdesk}
      DB_USER: app
      DB_PASSWORD_FILE: /run/secrets/app_password
      SMTP_HOST: mail
      SMTP_PORT: "1025"
      BACKUP_INTERVAL: ${BACKUP_INTERVAL:-3600}   # pour signaler une sauvegarde trop ancienne
      PGTZ: Europe/Paris   # dates des tickets à l'heure de Paris
    secrets: [app_password]
    depends_on:
      db:
        condition: service_healthy
    networks: [proxy, backend]
    logging: *logging
    deploy:
      resources:
        limits:
          memory: 256m
          cpus: "1"
          pids: 128
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"]
      start_period: 20s
      start_interval: 2s
      interval: 10s
      timeout: 3s
      retries: 3

  # Supervision et mail (Baptiste)

  prometheus:
    image: prom/prometheus:v3.5.0@sha256:63805ebb8d2b3920190daf1cb14a60871b16fd38bed42b857a3182bc621f4996
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    mem_limit: 512m
    pids_limit: 100
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro,z
      - prometheus-data:/prometheus
    networks: [proxy, backend]
    logging: *logging
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:9090/-/healthy"]
      interval: 10s
      timeout: 3s
      retries: 3

  grafana:
    image: grafana/grafana:12.2.0@sha256:74144189b38447facf737dfd0f3906e42e0776212bf575dc3334c3609183adf7
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m
    pids_limit: 100
    environment:
      GF_SECURITY_ADMIN_PASSWORD__FILE: /run/secrets/grafana_admin_password
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SERVER_ROOT_URL: http://grafana.localhost
    secrets: [grafana_admin_password]
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/prometheus.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro,z
      - ./grafana/dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro,z
      - ./grafana/helpdesk.json:/var/lib/grafana/dashboards/helpdesk.json:ro,z
    depends_on:
      prometheus:
        condition: service_healthy
    networks: [proxy]
    logging: *logging
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:3000/api/health"]
      start_period: 30s
      interval: 10s
      timeout: 3s
      retries: 3

  mail:
    image: axllent/mailpit:v1.27.7@sha256:cae83a33cd9b9598e4acb210be673dda7e741d5271ed4045310ab456950a136a
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    mem_limit: 128m
    pids_limit: 50
    environment:
      MP_DATABASE: /data/mailpit.db
    volumes:
      - mail-data:/data
    networks: [proxy, backend]
    logging: *logging
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 3s
      retries: 3

secrets:
  db_password:
    file: ./secrets/db_password.txt
  replication_password:
    file: ./secrets/replication_password.txt
  app_password:
    file: ./secrets/app_password.txt
  grafana_admin_password:
    file: ./secrets/grafana_admin_password.txt

networks:
  proxy:
  backend:
    internal: true

volumes:
  db-data:
  db-replica-data:
  backups:
  prometheus-data:
  grafana-data:
  mail-data: